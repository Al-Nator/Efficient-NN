[project]
name = "hw1"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "nvidia-ml-py>=13.615.71",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
    "torch>=2.11.0",
    "tqdm>=4.70.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
